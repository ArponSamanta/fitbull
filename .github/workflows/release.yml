name: Release zips

# Push a tag like v1.0.0 to build the plugin and theme zips and attach
# them to a GitHub release. Those zips are what you upload to WordPress.org.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: plugins/arponsamanta-fitness-toolkit/package-lock.json
      - run: bin/package.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/arponsamanta-fitness-toolkit.zip
            dist/fitbull.zip
