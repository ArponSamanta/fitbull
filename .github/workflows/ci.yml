name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  javascript:
    name: JS lint, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/fitbull-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: plugins/fitbull-core/package-lock.json
      - run: npm ci
      - run: npm run lint:js
      - run: npm run lint:css
      - run: npm test
      - run: npm run build
      - name: Committed build is up to date
        run: git diff --exit-code -- build || (echo "::error::Run 'npm run build' and commit plugins/fitbull-core/build" && exit 1)

  php:
    name: PHP ${{ matrix.php }} lint and unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.1", "8.3"]
    defaults:
      run:
        working-directory: plugins/fitbull-core
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer install --no-interaction --no-progress
      - name: Syntax check (plugin and theme)
        working-directory: .
        run: find plugins/fitbull-core themes/fitbull -name '*.php' -not -path '*/vendor/*' -not -path '*/node_modules/*' -print0 | xargs -0 -n1 php -l
      - run: vendor/bin/phpunit
