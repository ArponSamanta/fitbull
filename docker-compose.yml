services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-wordpress}
      MYSQL_USER: ${DB_USER:-wp}
      MYSQL_PASSWORD: ${DB_PASSWORD:-wp_pass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_pass}
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: ${DB_USER:-wp}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-wp_pass}
      WORDPRESS_DB_NAME: ${DB_NAME:-wordpress}
      WORDPRESS_DEBUG: 1
    volumes:
      - wp_data:/var/www/html
      - ./themes/fitbull:/var/www/html/wp-content/themes/fitbull
      - ./plugins/arponsamanta-fitness-toolkit:/var/www/html/wp-content/plugins/arponsamanta-fitness-toolkit

  # One-off WP-CLI commands, e.g.  docker compose run --rm wpcli wp fitness-toolkit seed
  wpcli:
    image: wordpress:cli-php8.3
    profiles: ["tools"]
    user: "33:33"
    depends_on:
      - db
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: ${DB_USER:-wp}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-wp_pass}
      WORDPRESS_DB_NAME: ${DB_NAME:-wordpress}
    volumes:
      - wp_data:/var/www/html
      - ./themes/fitbull:/var/www/html/wp-content/themes/fitbull
      - ./plugins/arponsamanta-fitness-toolkit:/var/www/html/wp-content/plugins/arponsamanta-fitness-toolkit

volumes:
  db_data:
  wp_data:
